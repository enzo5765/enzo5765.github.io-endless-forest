<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Endless Forest — WASD Movement</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background:#091012; }
    canvas { display:block; width:100vw; height:100vh; background: linear-gradient(#143, #0b2); }
    #ui {
      position: absolute; left: 12px; top: 12px; color: #dfffdc; 
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      text-shadow: 0 1px 0 rgba(0,0,0,0.6);
      background: rgba(0,0,0,0.15); padding:8px 10px; border-radius:8px;
      backdrop-filter: blur(4px);
    }
    #credits { position: absolute; right:12px; bottom:12px; color:#bfe; font-size:12px; opacity:0.8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    Controls: WASD / Arrow keys — Move. Shift = run. R = recenter.
  </div>
  <div id="credits">Endless Forest demo — deterministic procedural chunks</div>

  <script>
  (function () {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resize);
    resize();

    // Utilities: deterministic hash -> pseudo random in [0,1)
    function hashFloat(a,b,seed=0) {
      // mix coordinates into 32-bit unsigned, then multiply and scramble
      let n = (a * 374761393 + b * 668265263 + seed * 2654435761) >>> 0;
      n = (n ^ (n >>> 13)) >>> 0;
      n = Math.imul(n, 1274126177) >>> 0;
      return (n >>> 0) / 4294967296;
    }

    // World/chunk settings
    const CHUNK_SIZE = 512; // pixels per chunk
    const chunks = new Map(); // key: "cx,cy" -> array of trees

    function chunkKey(cx,cy){ return cx + ',' + cy; }

    function generateChunk(cx,cy) {
      const key = chunkKey(cx,cy);
      if (chunks.has(key)) return;
      const trees = [];
      // density varies per chunk
      const density = 6 + Math.floor(hashFloat(cx,cy,1) * 22); // between ~6 and 28
      for (let i = 0; i < density; i++) {
        const rx = hashFloat(cx,cy,i+3);
        const ry = hashFloat(cx,cy,i+7);
        const px = cx*CHUNK_SIZE + rx*CHUNK_SIZE;
        const py = cy*CHUNK_SIZE + ry*CHUNK_SIZE;
        const size = 18 + Math.floor(hashFloat(cx,cy,i+11) * 36); // tree radius
        // slight color variation
        const hue = 100 + Math.floor(hashFloat(cx,cy,i+17) * 40);
        const sat = 40 + Math.floor(hashFloat(cx,cy,i+19) * 30);
        trees.push({ x: px, y: py, r: size, hue, sat });
      }
      chunks.set(key, trees);
    }

    // ensure chunks in viewport are generated
    function ensureVisibleChunks(camX, camY, w, h) {
      const halfW = w/2, halfH = h/2;
      const left = camX - halfW - CHUNK_SIZE;
      const right = camX + halfW + CHUNK_SIZE;
      const top = camY - halfH - CHUNK_SIZE;
      const bottom = camY + halfH + CHUNK_SIZE;
      const minCx = Math.floor(left / CHUNK_SIZE);
      const maxCx = Math.floor(right / CHUNK_SIZE);
      const minCy = Math.floor(top / CHUNK_SIZE);
      const maxCy = Math.floor(bottom / CHUNK_SIZE);
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          generateChunk(cx,cy);
        }
      }
    }

    // Player
    const player = {
      x: 0,
      y: 0,
      r: 10,
      speed: 180, // px/sec
      runMultiplier: 1.9
    };

    // Camera: centered on player
    let camX = player.x, camY = player.y;

    // Input
    const keys = {};
    addEventListener('keydown', (e)=> {
      keys[e.key.toLowerCase()] = true;
      if (e.key === 'r' || e.key === 'R') {
        camX = player.x; camY = player.y;
      }
    });
    addEventListener('keyup', (e)=> {
      keys[e.key.toLowerCase()] = false;
    });

    // Collision: simple circle collision with trees
    function resolveCollisions(px,py) {
      const nearby = [];
      const pxMin = px - 150, pxMax = px + 150, pyMin = py - 150, pyMax = py + 150;
      const minCx = Math.floor(pxMin / CHUNK_SIZE);
      const maxCx = Math.floor(pxMax / CHUNK_SIZE);
      const minCy = Math.floor(pyMin / CHUNK_SIZE);
      const maxCy = Math.floor(pyMax / CHUNK_SIZE);
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          const list = chunks.get(chunkKey(cx,cy));
          if (!list) continue;
          for (const t of list) {
            if (t.x + t.r < px - 200 || t.x - t.r > px + 200 || t.y + t.r < py - 200 || t.y - t.r > py + 200) continue;
            nearby.push(t);
          }
        }
      }
      let newX = px, newY = py;
      for (const t of nearby) {
        const dx = newX - t.x, dy = newY - t.y;
        const dist = Math.hypot(dx,dy);
        const minDist = player.r + t.r;
        if (dist < minDist && dist > 0.0001) {
          const overlap = minDist - dist;
          // push player out along vector (weighted to avoid jitter)
          const nx = dx / dist, ny = dy / dist;
          newX += nx * overlap;
          newY += ny * overlap;
        } else if (dist === 0) {
          // identical pos, push randomly
          newX += minDist;
        }
      }
      return { x: newX, y: newY };
    }

    // Draw helpers
    function drawBackground() {
      // subtle patterned background with per-chunk shading
      const w = canvas.width, h = canvas.height;
      const grd = ctx.createLinearGradient(0,0,0,h);
      grd.addColorStop(0, '#072a16');
      grd.addColorStop(1, '#0b1c10');
      ctx.fillStyle = grd;
      ctx.fillRect(0,0,w,h);
    }

    function worldToScreen(wx,wy) {
      return { x: Math.floor((wx - camX) + canvas.width/2), y: Math.floor((wy - camY) + canvas.height/2) };
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000); // cap dt to avoid large jumps
      lastTime = now;

      // update player velocity from input
      let vx = 0, vy = 0;
      if (keys['w'] || keys['arrowup']) vy -= 1;
      if (keys['s'] || keys['arrowdown']) vy += 1;
      if (keys['a'] || keys['arrowleft']) vx -= 1;
      if (keys['d'] || keys['arrowright']) vx += 1;
      const len = Math.hypot(vx,vy);
      if (len > 0.0001) {
        vx /= len; vy /= len;
      }
      const isRunning = keys['shift'];
      const spd = player.speed * (isRunning ? player.runMultiplier : 1);
      player.x += vx * spd * dt;
      player.y += vy * spd * dt;

      // ensure chunks exist around camera target (which follows player)
      camX += (player.x - camX) * Math.min(1, 8*dt); // smooth camera
      camY += (player.y - camY) * Math.min(1, 8*dt);

      ensureVisibleChunks(camX, camY, canvas.width, canvas.height);

      // resolve collisions after movement
      const resolved = resolveCollisions(player.x, player.y);
      player.x = resolved.x; player.y = resolved.y;

      // draw scene
      drawBackground();

      // draw ground texture: light noise per chunk lines
      ctx.save();
      ctx.globalAlpha = 0.06;
      ctx.strokeStyle = '#0e2f1a';
      const gridSize = CHUNK_SIZE;
      const startX = Math.floor((camX - canvas.width/2) / gridSize) * gridSize;
      const startY = Math.floor((camY - canvas.height/2) / gridSize) * gridSize;
      for (let gx = startX - gridSize*2; gx < camX + canvas.width/2 + gridSize*2; gx += gridSize) {
        const sx = (gx - camX) + canvas.width/2;
        ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
      }
      for (let gy = startY - gridSize*2; gy < camY + canvas.height/2 + gridSize*2; gy += gridSize) {
        const sy = (gy - camY) + canvas.height/2;
        ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
      }
      ctx.restore();

      // draw trees from visible chunks, order by y to give depth
      const visibleTrees = [];
      const left = camX - canvas.width/2 - CHUNK_SIZE;
      const right = camX + canvas.width/2 + CHUNK_SIZE;
      const top = camY - canvas.height/2 - CHUNK_SIZE;
      const bottom = camY + canvas.height/2 + CHUNK_SIZE;
      const minCx = Math.floor(left / CHUNK_SIZE);
      const maxCx = Math.floor(right / CHUNK_SIZE);
      const minCy = Math.floor(top / CHUNK_SIZE);
      const maxCy = Math.floor(bottom / CHUNK_SIZE);
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          const list = chunks.get(chunkKey(cx,cy));
          if (!list) continue;
          for (const t of list) {
            if (t.x < left-50 || t.x > right+50 || t.y < top-50 || t.y > bottom+50) continue;
            visibleTrees.push(t);
          }
        }
      }
      visibleTrees.sort((a,b) => a.y - b.y);
      for (const t of visibleTrees) {
        const s = worldToScreen(t.x, t.y);
        // trunk
        const trunkW = Math.max(4, Math.floor(t.r * 0.3));
        ctx.fillStyle = '#5c3b1a';
        ctx.fillRect(s.x - trunkW/2, s.y - t.r*0.15, trunkW, t.r*0.3);
        // canopy shadow
        ctx.beginPath();
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.ellipse(s.x + 6, s.y + t.r*0.6, t.r*0.8, t.r*0.35, 0, 0, Math.PI*2);
        ctx.fill();
        // canopy
        ctx.beginPath();
        ctx.fillStyle = `hsl(${t.hue} ${t.sat}% 30%)`;
        ctx.arc(s.x, s.y - t.r*0.2, t.r, 0, Math.PI*2);
        ctx.fill();
        // highlight
        ctx.beginPath();
        ctx.fillStyle = `hsl(${t.hue} ${Math.min(60,t.sat+10)}% 45%)`;
        ctx.arc(s.x - t.r*0.2, s.y - t.r*0.4, t.r*0.45, 0, Math.PI*2);
        ctx.fill();
      }

      // draw player
      const pScreen = worldToScreen(player.x, player.y);
      // shadow
      ctx.beginPath();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.ellipse(pScreen.x + 6, pScreen.y + player.r*0.9, player.r*1.1, player.r*0.55, 0, 0, Math.PI*2);
      ctx.fill();
      // body
      ctx.beginPath();
      ctx.fillStyle = '#ff6b6b';
      ctx.arc(pScreen.x, pScreen.y - player.r*0.2, player.r, 0, Math.PI*2);
      ctx.fill();
      // center point
      ctx.fillStyle = '#fff';
      ctx.fillRect(pScreen.x-1, pScreen.y-1 - player.r*0.2, 2, 2);

      // HUD: coordinates
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(12, canvas.height-56, 220, 44);
      ctx.fillStyle = '#dfffdc';
      ctx.font = '13px system-ui, sans-serif';
      ctx.fillText(`Position: ${player.x.toFixed(0)}, ${player.y.toFixed(0)}`, 20, canvas.height-36);
      ctx.fillText(`Chunks generated: ${chunks.size}`, 20, canvas.height-18);

      requestAnimationFrame(loop);
    }

    // kick off initial generation and loop
    ensureVisibleChunks(camX, camY, canvas.width, canvas.height);
    requestAnimationFrame(loop);

    // simple pointer recenter - allow clicking to set player position (for testing)
    canvas.addEventListener('dblclick', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      player.x = camX + (sx - canvas.width/2);
      player.y = camY + (sy - canvas.height/2);
      camX = player.x; camY = player.y;
      ensureVisibleChunks(camX, camY, canvas.width, canvas.height);
    });

    // Prevent arrow keys from scrolling the page
    window.addEventListener("keydown", function(e) {
      if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.code) > -1) {
        e.preventDefault();
      }
    }, false);

  })();
  </script>
</body>
</html>
