<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Endless Forest — WASD Movement</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background:#091012; }
    canvas { display:block; width:100vw; height:100vh; background: linear-gradient(#143, #0b2); }
    #ui {
      position: absolute; left: 12px; top: 12px; color: #dfffdc; 
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      text-shadow: 0 1px 0 rgba(0,0,0,0.6);
      background: rgba(0,0,0,0.15); padding:8px 10px; border-radius:8px;
      backdrop-filter: blur(4px);
    }
    #ui div { line-height:1.2 }
    #credits { position: absolute; right:12px; bottom:12px; color:#bfe; font-size:12px; opacity:0.8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div>Controls: WASD / Arrow keys — Move. Shift = run. R = recenter. Hold left click near a tree to chop. Right click to place wood.</div>
    <div id="inventory" style="margin-top:6px; font-weight:600">Wood: <span id="woodCount">0</span></div>
  </div>
  <div id="credits">Endless Forest demo — smoother trees & wood placement</div>

  <script>
  (function () {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resize);
    resize();

    // Utilities: deterministic hash -> pseudo random in [0,1)
    function hashFloat(a,b,seed=0) {
      let n = (a * 374761393 + b * 668265263 + seed * 2654435761) >>> 0;
      n = (n ^ (n >>> 13)) >>> 0;
      n = Math.imul(n, 1274126177) >>> 0;
      return (n >>> 0) / 4294967296;
    }

    // World/chunk settings
    const CHUNK_SIZE = 512;
    const chunks = new Map();
    const woodPiles = [];

    function chunkKey(cx,cy){ return cx + ',' + cy; }

    function updateWoodUI() { document.getElementById('woodCount').textContent = player.wood; }

    function generateChunk(cx,cy) {
      const key = chunkKey(cx,cy);
      if (chunks.has(key)) return;
      const trees = [];
      const density = 6 + Math.floor(hashFloat(cx,cy,1) * 22);
      for (let i = 0; i < density; i++) {
        // spread trees more naturally with jitter and avoid blocky alignment
        const rx = hashFloat(cx,cy,i+3);
        const ry = hashFloat(cx,cy,i+7);
        // use sqrt distribution to cluster slightly towards center for variety
        const jx = (rx < 0.5 ? -1 : 1) * Math.pow(Math.abs(rx - 0.5) * 2, 1.1) * 0.5 + rx;
        const jy = (ry < 0.5 ? -1 : 1) * Math.pow(Math.abs(ry - 0.5) * 2, 1.1) * 0.5 + ry;
        // position across chunk plus small sub-pixel jitter
        const px = cx*CHUNK_SIZE + jx*CHUNK_SIZE + (hashFloat(cx,cy,i+23)-0.5)*8;
        const py = cy*CHUNK_SIZE + jy*CHUNK_SIZE + (hashFloat(cx,cy,i+29)-0.5)*8;
        const size = 18 + Math.floor(hashFloat(cx,cy,i+11) * 36);
        const hue = 100 + Math.floor(hashFloat(cx,cy,i+17) * 40);
        const sat = 40 + Math.floor(hashFloat(cx,cy,i+19) * 30);
        const hp = Math.round(size * 6);
        const id = key + ':' + i; // unique-ish id for reliable removal
        trees.push({ x: px, y: py, r: size, hue, sat, hp, id });
      }
      chunks.set(key, trees);
    }

    function ensureVisibleChunks(camX, camY, w, h) {
      const halfW = w/2, halfH = h/2;
      const left = camX - halfW - CHUNK_SIZE;
      const right = camX + halfW + CHUNK_SIZE;
      const top = camY - halfH - CHUNK_SIZE;
      const bottom = camY + halfH + CHUNK_SIZE;
      const minCx = Math.floor(left / CHUNK_SIZE);
      const maxCx = Math.floor(right / CHUNK_SIZE);
      const minCy = Math.floor(top / CHUNK_SIZE);
      const maxCy = Math.floor(bottom / CHUNK_SIZE);
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          generateChunk(cx,cy);
        }
      }
    }

    const player = {
      x: 0,
      y: 0,
      r: 10,
      speed: 180,
      runMultiplier: 1.9,
      wood: 0
    };

    let camX = player.x, camY = player.y;

    const keys = {};
    addEventListener('keydown', (e)=> {
      keys[e.key.toLowerCase()] = true;
      if (e.key === 'r' || e.key === 'R') {
        camX = player.x; camY = player.y;
      }
    });
    addEventListener('keyup', (e)=> {
      keys[e.key.toLowerCase()] = false;
    });

    // chopping state
    let isMouseDown = false;
    let chopTarget = null;
    const CHOP_REACH = 80; // world units
    const CHOP_RATE = 140; // HP/s

    // wood yield: map tree radius to 4-6 wood (4 for smallest, 6 for largest)
    const MIN_TREE_R = 18;
    const MAX_TREE_R = 53; // size = 18 + floor(rand*36) -> max 53
    function woodYieldFor(tree) {
      if (!tree) return 0;
      const t = Math.max(MIN_TREE_R, Math.min(MAX_TREE_R, tree.r));
      const norm = (t - MIN_TREE_R) / (MAX_TREE_R - MIN_TREE_R); // 0..1
      const yieldAmt = 4 + Math.round(norm * 2); // 4..6
      return Math.max(4, Math.min(6, yieldAmt));
    }

    function dropWoodAt(wx, wy) {
      if (player.wood <= 0) return false;
      player.wood -= 1;
      woodPiles.push({ x: wx, y: wy, amount: 1, r: 9 });
      updateWoodUI();
      return true;
    }

    function getTreeAtWorldPos(wx, wy) {
      const pxMin = wx - 120, pxMax = wx + 120;
      const pyMin = wy - 120, pyMax = wy + 120;
      const minCx = Math.floor(pxMin / CHUNK_SIZE);
      const maxCx = Math.floor(pxMax / CHUNK_SIZE);
      const minCy = Math.floor(pyMin / CHUNK_SIZE);
      const maxCy = Math.floor(pyMax / CHUNK_SIZE);
      let best = null, bestDist = Infinity;
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          const list = chunks.get(chunkKey(cx,cy));
          if (!list) continue;
          for (const t of list) {
            const d = Math.hypot(t.x - wx, t.y - wy);
            if (d < bestDist && d <= CHOP_REACH + t.r) {
              best = t; bestDist = d;
            }
          }
        }
      }
      return best;
    }

    function getNearestTreeToPlayer() {
      const pxMin = player.x - (CHOP_REACH + 120), pxMax = player.x + (CHOP_REACH + 120);
      const pyMin = player.y - (CHOP_REACH + 120), pyMax = player.y + (CHOP_REACH + 120);
      const minCx = Math.floor(pxMin / CHUNK_SIZE);
      const maxCx = Math.floor(pxMax / CHUNK_SIZE);
      const minCy = Math.floor(pyMin / CHUNK_SIZE);
      const maxCy = Math.floor(pyMax / CHUNK_SIZE);
      let best = null, bestDist = Infinity;
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          const list = chunks.get(chunkKey(cx,cy));
          if (!list) continue;
          for (const t of list) {
            const d = Math.hypot(t.x - player.x, t.y - player.y);
            if (d < bestDist && d <= CHOP_REACH + t.r) {
              best = t; bestDist = d;
            }
          }
        }
      }
      return best;
    }

    // left click = chop, right click = place wood
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const wx = camX + (sx - canvas.width/2);
      const wy = camY + (sy - canvas.height/2);

      if (e.button === 0) {
        isMouseDown = true;
        let tree = getNearestTreeToPlayer();
        if (!tree) tree = getTreeAtWorldPos(wx, wy);
        chopTarget = tree;
      } else if (e.button === 2) {
        dropWoodAt(wx, wy);
      }
    });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) {
        isMouseDown = false;
        chopTarget = null;
      }
    });
    canvas.addEventListener('mouseleave', () => { isMouseDown = false; chopTarget = null; });

    function removeTree(t) {
      // Try to remove by object identity first (fast path), then by id, then by proximity.
      for (const [key, list] of chunks.entries()) {
        const idx = list.indexOf(t);
        if (idx !== -1) { list.splice(idx, 1); return; }
        if (t && t.id) {
          const idIdx = list.findIndex(x => x.id === t.id);
          if (idIdx !== -1) { list.splice(idIdx, 1); return; }
        }
        const posIdx = list.findIndex(x => Math.abs(x.x - t.x) < 0.1 && Math.abs(x.y - t.y) < 0.1 && Math.abs(x.r - t.r) < 0.1);
        if (posIdx !== -1) { list.splice(posIdx, 1); return; }
      }
    }

    function resolveCollisions(px,py) {
      const nearby = [];
      const pxMin = px - 150, pxMax = px + 150, pyMin = py - 150, pyMax = py + 150;
      const minCx = Math.floor(pxMin / CHUNK_SIZE);
      const maxCx = Math.floor(pxMax / CHUNK_SIZE);
      const minCy = Math.floor(pyMin / CHUNK_SIZE);
      const maxCy = Math.floor(pyMax / CHUNK_SIZE);
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          const list = chunks.get(chunkKey(cx,cy));
          if (!list) continue;
          for (const t of list) {
            if (t.x + t.r < px - 200 || t.x - t.r > px + 200 || t.y + t.r < py - 200 || t.y - t.r > py + 200) continue;
            nearby.push(t);
          }
        }
      }
      let newX = px, newY = py;
      for (const t of nearby) {
        const dx = newX - t.x, dy = newY - t.y;
        const dist = Math.hypot(dx,dy);
        const minDist = player.r + t.r * 0.9;
        if (dist < minDist && dist > 0.0001) {
          const overlap = minDist - dist;
          const nx = dx / dist, ny = dy / dist;
          newX += nx * overlap;
          newY += ny * overlap;
        } else if (dist === 0) {
          newX += minDist;
        }
      }
      return { x: newX, y: newY };
    }

    function drawBackground() {
      const w = canvas.width, h = canvas.height;
      const grd = ctx.createLinearGradient(0,0,0,h);
      grd.addColorStop(0, '#072a16');
      grd.addColorStop(1, '#0b1c10');
      ctx.fillStyle = grd;
      ctx.fillRect(0,0,w,h);
    }

    function worldToScreen(wx,wy) {
      return { x: Math.floor((wx - camX) + canvas.width/2), y: Math.floor((wy - camY) + canvas.height/2) };
    }

    function drawWoodPile(wp) {
      const s = worldToScreen(wp.x, wp.y);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.fillStyle = '#8a5a2b';
      ctx.beginPath(); ctx.ellipse(0, 0, 10, 5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#6d4220';
      ctx.fillRect(-11, 2, 22, 6);
      ctx.restore();
    }

    function drawTreeSprite(tree) {
      const s = worldToScreen(tree.x, tree.y);
      const trunkH = Math.max(22, Math.round(tree.r * 1.2));
      const trunkW = Math.max(8, Math.round(tree.r * 0.28));
      const canopyColor = (tL) => `hsl(${tree.hue} ${tree.sat}% ${tL}%)`;
      ctx.beginPath(); ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.ellipse(s.x, s.y + 8, tree.r*0.9, tree.r*0.45, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = canopyColor(32);
      ctx.beginPath(); ctx.ellipse(s.x, s.y - tree.r*0.2, tree.r*0.9, tree.r*0.8, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = canopyColor(36);
      ctx.beginPath(); ctx.ellipse(s.x - tree.r*0.45, s.y, tree.r*0.65, tree.r*0.6, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s.x + tree.r*0.45, s.y, tree.r*0.65, tree.r*0.6, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = canopyColor(46);
      ctx.beginPath(); ctx.ellipse(s.x - tree.r*0.15, s.y - tree.r*0.35, tree.r*0.35, tree.r*0.25, 0, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#5a3822';
      ctx.fillRect(s.x - trunkW/2, s.y + 6, trunkW, trunkH);
      ctx.fillStyle = '#734d2b';
      ctx.fillRect(s.x - trunkW/2 + 2, s.y + 8, trunkW - 4, trunkH - 6);

      ctx.fillStyle = '#234e2a';
      ctx.fillRect(s.x - tree.r*0.6, s.y + trunkH + 6, tree.r*1.2, Math.max(6, Math.round(tree.r*0.18)));
    }

    function drawPlayerSprite() {
      const pScreen = worldToScreen(player.x, player.y);
      const x = pScreen.x;
      const y = pScreen.y;

      ctx.beginPath(); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.ellipse(x + 2, y + 15, 9, 5, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#2a211d'; ctx.fillRect(x - 5, y - 18, 10, 3); ctx.fillRect(x - 6, y - 15, 12, 2);
      ctx.fillStyle = '#f0c9a6'; ctx.fillRect(x - 4, y - 15, 8, 8); ctx.fillStyle = '#d7a77e'; ctx.fillRect(x - 3, y - 12, 6, 6);
      ctx.fillStyle = '#4d7ac7'; ctx.fillRect(x - 5, y - 6, 10, 9); ctx.fillStyle = '#2b4b8f'; ctx.fillRect(x - 4, y - 4, 8, 5);
      ctx.fillStyle = '#f0c9a6'; ctx.fillRect(x - 7, y - 5, 2, 8); ctx.fillRect(x + 5, y - 5, 2, 8);
      ctx.fillStyle = '#1b1d24'; ctx.fillRect(x - 4, y + 3, 3, 9); ctx.fillRect(x + 1, y + 3, 3, 9);
      ctx.fillStyle = '#383b45'; ctx.fillRect(x - 5, y + 11, 4, 2); ctx.fillRect(x + 1, y + 11, 4, 2);
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      let vx = 0, vy = 0;
      if (keys['w'] || keys['arrowup']) vy -= 1;
      if (keys['s'] || keys['arrowdown']) vy += 1;
      if (keys['a'] || keys['arrowleft']) vx -= 1;
      if (keys['d'] || keys['arrowright']) vx += 1;
      const len = Math.hypot(vx,vy);
      if (len > 0.0001) { vx /= len; vy /= len; }
      const isRunning = keys['shift'];
      const spd = player.speed * (isRunning ? player.runMultiplier : 1);
      player.x += vx * spd * dt;
      player.y += vy * spd * dt;

      camX += (player.x - camX) * Math.min(1, 8*dt);
      camY += (player.y - camY) * Math.min(1, 8*dt);

      ensureVisibleChunks(camX, camY, canvas.width, canvas.height);

      // chopping
      if (isMouseDown && chopTarget) {
        const dist = Math.hypot(chopTarget.x - player.x, chopTarget.y - player.y);
        if (dist > CHOP_REACH + chopTarget.r + 8) {
          chopTarget = null;
        } else {
          chopTarget.hp -= CHOP_RATE * dt;
          if (chopTarget.hp <= 0) {
            // give 4-6 wood depending on tree size (4 = smallest, 6 = biggest)
            const yieldAmt = woodYieldFor(chopTarget);
            player.wood += yieldAmt;
            updateWoodUI();
            removeTree(chopTarget);
            chopTarget = null;
            if (isMouseDown) {
              chopTarget = getNearestTreeToPlayer();
            }
          }
        }
      } else if (isMouseDown && !chopTarget) {
        chopTarget = getNearestTreeToPlayer();
      }

      const resolved = resolveCollisions(player.x, player.y);
      player.x = resolved.x; player.y = resolved.y;

      drawBackground();

      ctx.save(); ctx.globalAlpha = 0.06; ctx.strokeStyle = '#0e2f1a';
      const gridSize = CHUNK_SIZE;
      const startX = Math.floor((camX - canvas.width/2) / gridSize) * gridSize;
      const startY = Math.floor((camY - canvas.height/2) / gridSize) * gridSize;
      for (let gx = startX - gridSize*2; gx < camX + canvas.width/2 + gridSize*2; gx += gridSize) {
        const sx = (gx - camX) + canvas.width/2; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
      }
      for (let gy = startY - gridSize*2; gy < camY + canvas.height/2 + gridSize*2; gy += gridSize) {
        const sy = (gy - camY) + canvas.height/2; ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
      }
      ctx.restore();

      const visibleTrees = [];
      const left = camX - canvas.width/2 - CHUNK_SIZE;
      const right = camX + canvas.width/2 + CHUNK_SIZE;
      const top = camY - canvas.height/2 - CHUNK_SIZE;
      const bottom = camY + canvas.height/2 + CHUNK_SIZE;
      const minCx = Math.floor(left / CHUNK_SIZE);
      const maxCx = Math.floor(right / CHUNK_SIZE);
      const minCy = Math.floor(top / CHUNK_SIZE);
      const maxCy = Math.floor(bottom / CHUNK_SIZE);
      for (let cx = minCx; cx <= maxCx; cx++) {
        for (let cy = minCy; cy <= maxCy; cy++) {
          const list = chunks.get(chunkKey(cx,cy));
          if (!list) continue;
          for (const t of list) {
            if (t.x < left-50 || t.x > right+50 || t.y < top-50 || t.y > bottom+50) continue;
            visibleTrees.push(t);
          }
        }
      }
      visibleTrees.sort((a,b) => a.y - b.y);
      for (const t of visibleTrees) { drawTreeSprite(t); }

      for (const wp of woodPiles) drawWoodPile(wp);

      if (chopTarget) {
        const s = worldToScreen(chopTarget.x, chopTarget.y);
        const totalHp = Math.round(chopTarget.r * 6);
        const pct = Math.max(0, Math.min(1, (totalHp - chopTarget.hp) / totalHp));
        const barW = 64, barH = 8;
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(s.x - barW/2, s.y - 60, barW, barH);
        ctx.fillStyle = '#b86f3c'; ctx.fillRect(s.x - barW/2 + 1, s.y - 60 + 1, (barW - 2) * pct, barH - 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.strokeRect(s.x - barW/2, s.y - 60, barW, barH);
      }

      drawPlayerSprite();

      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(12, canvas.height-56, 260, 44);
      ctx.fillStyle = '#dfffdc'; ctx.font = '13px system-ui, sans-serif';
      ctx.fillText(`Position: ${player.x.toFixed(0)}, ${player.y.toFixed(0)}`, 20, canvas.height-36);
      ctx.fillText(`Chunks generated: ${chunks.size}  Wood: ${player.wood}`, 20, canvas.height-18);

      requestAnimationFrame(loop);
    }

    ensureVisibleChunks(camX, camY, canvas.width, canvas.height);
    updateWoodUI();
    requestAnimationFrame(loop);

    canvas.addEventListener('dblclick', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      player.x = camX + (sx - canvas.width/2);
      player.y = camY + (sy - canvas.height/2);
      camX = player.x; camY = player.y;
      ensureVisibleChunks(camX, camY, canvas.width, canvas.height);
    });

    window.addEventListener("keydown", function(e) {
      if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.code) > -1) {
        e.preventDefault();
      }
    }, false);

  })();
  </script>
</body>
</html>
